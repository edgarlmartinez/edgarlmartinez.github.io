fill="none"/><path d="M600 265 q8 -10 16 0 t16 0" stroke="#d14b4b" stroke-width="2" fill="none"/><path d="M607 230 q8 -10 16 0 t16 0" stroke="#d14b4b" stroke-width="2" fill="none"/><path d="M610 232 q8 -10 16 0 t16 0" stroke="#d14b4b" stroke-width="2" fill="none"/><path d="M636 260 q8 -10 16 0 t16 0" stroke="#d14b4b" stroke-width="2" fill="none"/><circle cx="615" cy="320" r="9" fill="#d14b4b"/><circle cx="632" cy="324" r="8" fill="#4b7bd1"/><circle cx="624" cy="340" r="6" fill="#f2d24b"/><text x="670" y="40" text-anchor="middle" fill="#f3a3a3" font-size="19" font-weight="700">Worry: possible SARCOMA</text><text x="560" y="72" fill="#d9c2ea" font-size="12">breaks through the fascia</text><rect x="40" y="438" width="16" height="16" fill="#3b3524"/><text x="62" y="451" fill="#9aa7b6" font-size="13">Subcutaneous fat</text><rect x="210" y="438" width="16" height="16" fill="#e9e3d2"/><text x="232" y="451" fill="#9aa7b6" font-size="13">Fascia</text><rect x="380" y="438" width="16" height="16" fill="#5a2e2e"/><text x="402" y="451" fill="#9aa7b6" font-size="13">Muscle</text><rect x="550" y="438" width="16" height="16" fill="#d9dee4"/><text x="572" y="451" fill="#9aa7b6" font-size="13">Bone</text><rect x="720" y="438" width="16" height="16" fill="#d14b4b"/><text x="742" y="451" fill="#9aa7b6" font-size="13">Neurovascular bundle</text><text x="40" y="490" fill="#e6ebf1" font-size="13.5"><tspan fill="#7fd6a0">✓ </tspan>Superficial: in the fat, above the fascia</text><text x="490" y="490" fill="#e6ebf1" font-size="13.5"><tspan fill="#f3a3a3">✗ </tspan>Deep: below or through the fascia</text><text x="40" y="514" fill="#e6ebf1" font-size="13.5"><tspan fill="#7fd6a0">✓ </tspan>Small: under 5 cm</text><text x="490" y="514" fill="#e6ebf1" font-size="13.5"><tspan fill="#f3a3a3">✗ </tspan>Large: 5 cm or more, or growing</text><text x="40" y="538" fill="#e6ebf1" font-size="13.5"><tspan fill="#7fd6a0">✓ </tspan>Well circumscribed, homogeneous</text><text x="490" y="538" fill="#e6ebf1" font-size="13.5"><tspan fill="#f3a3a3">✗ </tspan>Infiltrative margins, heterogeneous, necrosis</text><text x="40" y="562" fill="#e6ebf1" font-size="13.5"><tspan fill="#7fd6a0">✓ </tspan>No or little internal vascularity</text><text x="490" y="562" fill="#e6ebf1" font-size="13.5"><tspan fill="#f3a3a3">✗ </tspan>Internal vascularity</text><text x="40" y="586" fill="#e6ebf1" font-size="13.5"><tspan fill="#7fd6a0">✓ </tspan>Respects fascia, vessels, nerves, bone</text><text x="490" y="586" fill="#e6ebf1" font-size="13.5"><tspan fill="#f3a3a3">✗ </tspan>Crosses fascia; encases vessels and nerves; touches bone</text><text x="40" y="626" fill="#5d6977" font-size="11.5">Schematic axial cross-section of a thigh. These are red flags, not rules: many benign masses are deep or large (see text).</text></svg>