<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif"><rect width="900" height="500" fill="#0b0f14"/><text x="30" y="34" fill="#e9f1f8" font-size="16" font-weight="600">Meniscus (sagittal, posterior horn)</text><rect x="40" y="50" width="250" height="150" rx="10" fill="#4a4a4a"/><path d="M70 180 L260 180 L260 80 Z" fill="#0a0a0a"/><text x="165" y="222" text-anchor="middle" fill="#7fd6a0" font-size="15" font-weight="700">Normal</text><text x="165" y="242" text-anchor="middle" fill="#9aa7b6" font-size="12.5">Uniformly dark</text><rect x="330" y="50" width="250" height="150" rx="10" fill="#4a4a4a"/><path d="M360 180 L550 180 L550 80 Z" fill="#0a0a0a"/><ellipse cx="505" cy="150" rx="26" ry="6" fill="#8d8d8d" transform="rotate(-25 505 150)"/><text x="455" y="222" text-anchor="middle" fill="#e8d98c" font-size="15" font-weight="700">Degeneration</text><text x="455" y="242" text-anchor="middle" fill="#9aa7b6" font-size="12.5">Intermediate signal inside,</text><text x="455" y="259" text-anchor="middle" fill="#9aa7b6" font-size="12.5">does not reach a surface</text><rect x="620" y="50" width="250" height="150" rx="10" fill="#4a4a4a"/><path d="M650 180 L840 180 L840 80 Z" fill="#0a0a0a"/><line x1="760" y1="180" x2="825" y2="118" stroke="#f2f2f2" stroke-width="4"/><text x="745" y="222" text-anchor="middle" fill="#f3a3a3" font-size="15" font-weight="700">Tear</text><text x="745" y="242" text-anchor="middle" fill="#9aa7b6" font-size="12.5">Signal reaches the surface</text><text x="745" y="259" text-anchor="middle" fill="#9aa7b6" font-size="12.5">on 2 or more images</text><text x="30" y="290" fill="#e9f1f8" font-size="16" font-weight="600">Tendon (long axis)</text><rect x="40" y="305" width="190" height="120" rx="10" fill="#4a4a4a"/><rect x="50" y="355" width="170" height="16" rx="8" fill="#0a0a0a"/><text x="135" y="447" text-anchor="middle" fill="#7fd6a0" font-size="14.5" font-weight="700">Normal</text><text x="135" y="466" text-anchor="middle" fill="#9aa7b6" font-size="12">Thin, dark</text><rect x="255" y="305" width="190" height="120" rx="10" fill="#4a4a4a"/><path d="M265 355 H305 Q350 330 395 355 H435 V371 H395 Q350 398 305 371 H265 Z" fill="#0a0a0a"/><ellipse cx="350" cy="363" rx="34" ry="9" fill="#7a7a7a"/><text x="350" y="447" text-anchor="middle" fill="#e8d98c" font-size="14.5" font-weight="700">Tendinosis</text><text x="350" y="466" text-anchor="middle" fill="#9aa7b6" font-size="12">Thick, intermediate (gray) signal</text><rect x="470" y="305" width="190" height="120" rx="10" fill="#4a4a4a"/><path d="M480 352 H650 V374 H480 Z" fill="#0a0a0a"/><path d="M540 352 L595 362 L540 366 Z" fill="#f2f2f2"/><text x="565" y="447" text-anchor="middle" fill="#f6c28c" font-size="14.5" font-weight="700">Partial tear</text><text x="565" y="466" text-anchor="middle" fill="#9aa7b6" font-size="12">Fluid-bright cleft</text><rect x="685" y="305" width="190" height="120" rx="10" fill="#4a4a4a"/><rect x="695" y="355" width="55" height="18" rx="9" fill="#0a0a0a"/><rect x="810" y="355" width="55" height="18" rx="9" fill="#0a0a0a"/><ellipse cx="780" cy="364" rx="32" ry="16" fill="#f2f2f2"/><text x="780" y="447" text-anchor="middle" fill="#f3a3a3" font-size="14.5" font-weight="700">Full-thickness tear</text><text x="780" y="466" text-anchor="middle" fill="#9aa7b6" font-size="12">Fluid-filled gap, retracted ends</text><text x="30" y="492" fill="#5d6977" font-size="11.5">Schematic fluid-sensitive (PD or T2) images. Gray = degeneration (intermediate signal); white = water where water should not be.</text></svg>