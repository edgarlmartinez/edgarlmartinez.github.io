<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, system-ui, sans-serif"><rect width="900" height="400" fill="#0b0f14"/><path d="M20 30 H282 L310 66 L282 102 H20 Z" fill="#6b241c"/><text x="165" y="72" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">History</text><text x="50" y="140" fill="#e6ebf1" font-size="13.5">• Previous lesion or known cancer?</text><text x="50" y="168" fill="#e6ebf1" font-size="13.5">• Surgery or radiation?</text><text x="50" y="196" fill="#e6ebf1" font-size="13.5">• Painful or painless?</text><text x="50" y="224" fill="#e6ebf1" font-size="13.5">• Trauma or anticoagulation?</text><text x="50" y="252" fill="#e6ebf1" font-size="13.5">• Stable, slow or fast growing?</text><text x="50" y="280" fill="#e6ebf1" font-size="13.5">• One lesion or many?</text><path d="M310 30 H572 L600 66 L572 102 H310 L338 66 Z" fill="#93321f"/><text x="455" y="72" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Imaging: XR, US, MRI, CT</text><text x="340" y="140" fill="#e6ebf1" font-size="13.5">• Calcification</text><text x="340" y="168" fill="#e6ebf1" font-size="13.5">• Invasion of neighbors</text><text x="340" y="196" fill="#e6ebf1" font-size="13.5">• Fat signal (T1, T1 fat-sat)</text><text x="340" y="224" fill="#e6ebf1" font-size="13.5">• Edema-like signal (T2 FS, STIR)</text><text x="340" y="252" fill="#e6ebf1" font-size="13.5">• Blood, hemosiderin (GRE)</text><text x="340" y="280" fill="#e6ebf1" font-size="13.5">• Vascularity (gadolinium, Doppler)</text><text x="340" y="308" fill="#e6ebf1" font-size="13.5">• Size, growth, margins</text><path d="M600 30 H862 L890 66 L862 102 H600 L628 66 Z" fill="#b8402c"/><text x="745" y="72" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Conclusion and advice</text><text x="630" y="140" fill="#7fd6a0" font-size="14" font-weight="600">1. Reliably benign</text><text x="630" y="168" fill="#f3a3a3" font-size="14" font-weight="600">2. Malignant</text><text x="630" y="196" fill="#e8d98c" font-size="14" font-weight="600">3. Non-specific (indeterminate)</text><text x="630" y="245" fill="#9aa7b6" font-size="12.5">so the advice is one of:</text><text x="630" y="275" fill="#7fd6a0" font-size="14">• No further intervention</text><text x="630" y="303" fill="#e8d98c" font-size="14">• Short-interval follow-up</text><text x="630" y="331" fill="#e8d98c" font-size="14">• Biopsy, planned with the surgeon</text><text x="630" y="359" fill="#f6c28c" font-size="14">• Surgical or sarcoma-center consult</text><text x="20" y="388" fill="#5d6977" font-size="11.5">Redrawn from the author's lecture slides.</text></svg>