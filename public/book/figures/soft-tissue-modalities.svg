<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, system-ui, sans-serif"><rect width="900" height="470" fill="#0b0f14"/><rect x="20" y="20" width="273" height="430" rx="12" fill="#11161c" stroke="#3a4450"/><text x="156" y="52" text-anchor="middle" fill="#5cc8da" font-size="18" font-weight="700">Radiograph</text><text x="156" y="74" text-anchor="middle" fill="#9aa7b6" font-size="13">First look</text><rect x="66" y="92" width="180" height="150" rx="8" fill="#3a3f45"/><rect x="136" y="92" width="40" height="150" fill="#d9dee4"/><ellipse cx="106" cy="167" rx="30" ry="50" fill="#4c5258"/><circle cx="96" cy="142" r="5" fill="none" stroke="#f2f5f8" stroke-width="2.5"/><circle cx="96" cy="142" r="1.6" fill="#f2f5f8"/><circle cx="114" cy="172" r="5" fill="none" stroke="#f2f5f8" stroke-width="2.5"/><circle cx="114" cy="172" r="1.6" fill="#f2f5f8"/><circle cx="98" cy="192" r="5" fill="none" stroke="#f2f5f8" stroke-width="2.5"/><circle cx="98" cy="192" r="1.6" fill="#f2f5f8"/><circle cx="116" cy="202" r="5" fill="none" stroke="#f2f5f8" stroke-width="2.5"/><circle cx="116" cy="202" r="1.6" fill="#f2f5f8"/><text x="42" y="280" fill="#e6ebf1" font-size="13.5">• Phleboliths: vascular malformation</text><text x="42" y="310" fill="#e6ebf1" font-size="13.5">• Bone in the mass: ossification</text><text x="42" y="340" fill="#e6ebf1" font-size="13.5">• Fat lucency: lipoma</text><text x="42" y="370" fill="#e6ebf1" font-size="13.5">• Bone erosion or invasion</text><rect x="313" y="20" width="273" height="430" rx="12" fill="#11161c" stroke="#3a4450"/><text x="449" y="52" text-anchor="middle" fill="#5cc8da" font-size="18" font-weight="700">Ultrasound</text><text x="449" y="74" text-anchor="middle" fill="#9aa7b6" font-size="13">Superficial lumps</text><path d="M359 92 H539 L559 242 H339 Z" fill="#141414"/><path d="M349 122 H549" stroke="#bdbdbd" stroke-width="1.5"/><path d="M345 192 H553" stroke="#e6e6e6" stroke-width="3"/><text x="545" y="187" text-anchor="end" fill="#9aa7b6" font-size="10">fascia</text><ellipse cx="409" cy="154" rx="34" ry="20" fill="#050505" stroke="#9a9a9a"/><text x="409" y="158" text-anchor="middle" fill="#7fd6a0" font-size="10">cyst</text><ellipse cx="494" cy="212" rx="40" ry="24" fill="#5a5a5a"/><path d="M469 200 q5 6 10 0" stroke="#e0473a" stroke-width="2.5" fill="none"/><path d="M471 214 q5 6 10 0" stroke="#3a74e0" stroke-width="2.5" fill="none"/><path d="M480 210 q5 6 10 0" stroke="#e0473a" stroke-width="2.5" fill="none"/><path d="M482 214 q5 6 10 0" stroke="#3a74e0" stroke-width="2.5" fill="none"/><path d="M491 200 q5 6 10 0" stroke="#e0473a" stroke-width="2.5" fill="none"/><path d="M493 214 q5 6 10 0" stroke="#3a74e0" stroke-width="2.5" fill="none"/><path d="M502 210 q5 6 10 0" stroke="#e0473a" stroke-width="2.5" fill="none"/><path d="M504 214 q5 6 10 0" stroke="#3a74e0" stroke-width="2.5" fill="none"/><path d="M513 200 q5 6 10 0" stroke="#e0473a" stroke-width="2.5" fill="none"/><path d="M515 214 q5 6 10 0" stroke="#3a74e0" stroke-width="2.5" fill="none"/><text x="494" y="240" text-anchor="middle" fill="#f3a3a3" font-size="10">deep, vascular</text><text x="335" y="280" fill="#e6ebf1" font-size="13.5">• Cyst or solid?</text><text x="335" y="310" fill="#e6ebf1" font-size="13.5">• Above or below the fascia?</text><text x="335" y="340" fill="#e6ebf1" font-size="13.5">• Doppler: vascular or not</text><text x="335" y="370" fill="#e6ebf1" font-size="13.5">• Compressible? Moves with tendon?</text><text x="335" y="400" fill="#e6ebf1" font-size="13.5">• Guides the needle</text><rect x="606" y="20" width="273" height="430" rx="12" fill="#11161c" stroke="#3a4450"/><text x="742" y="52" text-anchor="middle" fill="#5cc8da" font-size="18" font-weight="700">MRI</text><text x="742" y="74" text-anchor="middle" fill="#9aa7b6" font-size="13">Deep, large or unclear</text><rect x="652" y="92" width="180" height="150" rx="8" fill="#4a4a4a"/><path d="M692 122 Q772 102 792 162 Q802 222 732 217 Q672 212 692 122 Z" fill="#cfcfcf"/><ellipse cx="747" cy="167" rx="24" ry="16" fill="#f7f7f7"/><ellipse cx="722" cy="182" rx="12" ry="9" fill="#7a7a7a"/><circle cx="802" cy="212" r="7" fill="#0a0a0a"/><circle cx="814" cy="214" r="6" fill="#0a0a0a"/><text x="628" y="280" fill="#e6ebf1" font-size="13.5">• Fat? Fluid? Blood?</text><text x="628" y="310" fill="#e6ebf1" font-size="13.5">• Heterogeneity and necrosis</text><text x="628" y="340" fill="#e6ebf1" font-size="13.5">• Enhancement after gadolinium</text><text x="628" y="370" fill="#e6ebf1" font-size="13.5">• Fascia, vessels, nerves, bone</text><text x="628" y="400" fill="#e6ebf1" font-size="13.5">• Staging and surgical map</text></svg>