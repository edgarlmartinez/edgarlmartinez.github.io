<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <rect width="900" height="520" fill="#0b0f14"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa7b6"/></marker></defs>
  <g fill="none" stroke="#9aa7b6" stroke-width="2" marker-end="url(#a)">
    <path d="M450 78 V112"/>
    <path d="M330 168 H196 V226"/>
    <path d="M570 168 H700 V226"/>
    <path d="M700 296 V330"/>
    <path d="M450 168 V226" stroke-dasharray="5 5"/>
  </g>
  <rect x="300" y="22" width="300" height="56" rx="12" fill="#11161c" stroke="#3a4450"/>
  <text x="450" y="47" text-anchor="middle" fill="#e9f1f8" font-size="17" font-weight="600">A bone lesion on the radiograph</text>
  <text x="450" y="67" text-anchor="middle" fill="#9aa7b6" font-size="13">Two orthogonal views. Age, site, symptoms.</text>
  <rect x="270" y="112" width="360" height="56" rx="12" fill="#10292f" stroke="#5cc8da"/>
  <text x="450" y="137" text-anchor="middle" fill="#e9f1f8" font-size="17" font-weight="600">TASK 1. Can I name it and leave it?</text>
  <text x="450" y="157" text-anchor="middle" fill="#9fe3ee" font-size="13">Is this a classic "do not touch" lesion?</text>
  <text x="262" y="158" text-anchor="end" fill="#7fd6a0" font-size="14" font-weight="600">YES</text>
  <text x="640" y="158" fill="#f0a35c" font-size="14" font-weight="600">NO / NOT SURE</text>
  <text x="462" y="205" fill="#9aa7b6" font-size="12">can't see it well</text>
  <rect x="40" y="226" width="312" height="132" rx="12" fill="#0c1f15" stroke="#4fae78"/>
  <text x="196" y="254" text-anchor="middle" fill="#7fd6a0" font-size="17" font-weight="700">BENIGN BIN</text>
  <text x="196" y="278" text-anchor="middle" fill="#e6ebf1" font-size="14">Name it. Say "benign, leave alone".</text>
  <text x="196" y="300" text-anchor="middle" fill="#e6ebf1" font-size="14">Bone-RADS 1 (1–2 points)</text>
  <text x="196" y="322" text-anchor="middle" fill="#9aa7b6" font-size="12.5">No biopsy. Follow up only if it hurts,</text>
  <text x="196" y="340" text-anchor="middle" fill="#9aa7b6" font-size="12.5">fractures or changes.</text>
  <rect x="372" y="226" width="156" height="132" rx="12" fill="#11161c" stroke="#3a4450" stroke-dasharray="5 5"/>
  <text x="450" y="254" text-anchor="middle" fill="#e9f1f8" font-size="15" font-weight="700">CAN'T SORT YET</text>
  <text x="450" y="278" text-anchor="middle" fill="#e6ebf1" font-size="13.5">Bone-RADS 0</text>
  <text x="450" y="300" text-anchor="middle" fill="#9aa7b6" font-size="12.5">Another view,</text>
  <text x="450" y="318" text-anchor="middle" fill="#9aa7b6" font-size="12.5">CT or MRI first</text>
  <text x="450" y="340" text-anchor="middle" fill="#9aa7b6" font-size="12.5">(e.g. pelvis, spine)</text>
  <rect x="548" y="226" width="312" height="70" rx="12" fill="#22170b" stroke="#f0a35c"/>
  <text x="704" y="254" text-anchor="middle" fill="#f6c28c" font-size="17" font-weight="700">TASK 2. How aggressive?</text>
  <text x="704" y="278" text-anchor="middle" fill="#e6ebf1" font-size="13.5">Score margin, periosteum, cortex, mass</text>
  <g font-size="13.5">
    <rect x="548" y="330" width="312" height="44" rx="10" fill="#1a1a0c" stroke="#c9b458"/>
    <text x="562" y="350" fill="#e8d98c" font-weight="700">Bone-RADS 2 · 3–4 pts · low risk</text>
    <text x="562" y="367" fill="#9aa7b6" font-size="12.5">Short-interval follow-up (3–6 months)</text>
    <rect x="548" y="382" width="312" height="44" rx="10" fill="#22170b" stroke="#f0a35c"/>
    <text x="562" y="402" fill="#f6c28c" font-weight="700">Bone-RADS 3 · 5–6 pts · intermediate</text>
    <text x="562" y="419" fill="#9aa7b6" font-size="12.5">CT/MRI and orthopedic oncology referral</text>
    <rect x="548" y="434" width="312" height="62" rx="10" fill="#2a1010" stroke="#e06c6c"/>
    <text x="562" y="454" fill="#f3a3a3" font-weight="700">Bone-RADS 4 · ≥7 pts · high risk</text>
    <text x="562" y="471" fill="#9aa7b6" font-size="12.5">Malignant until proven otherwise. Refer</text>
    <text x="562" y="487" fill="#9aa7b6" font-size="12.5">before biopsy; stage the patient.</text>
  </g>
  <text x="40" y="404" fill="#e9f1f8" font-size="14" font-weight="600">The daily rule</text>
  <text x="40" y="426" fill="#9aa7b6" font-size="13">A lesion earns the benign bin only with positive,</text>
  <text x="40" y="446" fill="#9aa7b6" font-size="13">classic features. "Nothing scary" is not enough.</text>
  <text x="40" y="466" fill="#9aa7b6" font-size="13">If you can't name it, it goes to Task 2.</text>
  <text x="40" y="500" fill="#5d6977" font-size="11">Schematic after ACR Bone-RADS v2023 (Caracciolo et al., JACR 2023).</text>
</svg>
