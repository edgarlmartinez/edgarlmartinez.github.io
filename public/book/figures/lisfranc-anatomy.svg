<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, system-ui, sans-serif"><rect width="900" height="420" fill="#0b0f14"/><rect x="60" y="190" width="62" height="110" rx="10" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><rect x="124" y="218" width="44" height="82" rx="8" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><rect x="170" y="200" width="46" height="100" rx="8" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><rect x="218" y="210" width="70" height="90" rx="12" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="91" y="255" text-anchor="middle" fill="#1b232c" font-size="15" font-weight="700">C1</text><text x="146" y="268" text-anchor="middle" fill="#1b232c" font-size="15" font-weight="700">C2</text><text x="193" y="258" text-anchor="middle" fill="#1b232c" font-size="15" font-weight="700">C3</text><text x="253" y="262" text-anchor="middle" fill="#1b232c" font-size="15" font-weight="700">Cu</text><path d="M64 188 L70 50 L118 50 L124 188 Z" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="94.0" y="110" text-anchor="middle" fill="#1b232c" font-size="14" font-weight="700">M1</text><path d="M126 216 L132 50 L160 50 L166 216 Z" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="146.0" y="110" text-anchor="middle" fill="#1b232c" font-size="14" font-weight="700">M2</text><path d="M170 198 L176 50 L208 50 L214 198 Z" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="192.0" y="110" text-anchor="middle" fill="#1b232c" font-size="14" font-weight="700">M3</text><path d="M218 208 L224 50 L246 50 L252 208 Z" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="235.0" y="110" text-anchor="middle" fill="#1b232c" font-size="14" font-weight="700">M4</text><path d="M254 208 L260 50 L284 50 L290 208 Z" fill="#c9d1da" stroke="#0b0f14" stroke-width="2"/><text x="272.0" y="110" text-anchor="middle" fill="#1b232c" font-size="14" font-weight="700">M5</text><line x1="112" y1="246" x2="140" y2="206" stroke="#e0473a" stroke-width="9" stroke-linecap="round"/><line x1="125" y1="30" x2="125" y2="300" stroke="#5cc8da" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="70" fill="#e6ebf1" font-size="16" font-weight="700">The Lisfranc joint, seen from above</text><rect x="330" y="93" width="14" height="14" rx="3" fill="#e0473a"/><text x="352" y="105" fill="#e6ebf1" font-size="14">Lisfranc ligament: medial cuneiform (C1) to the base of M2.</text><text x="352" y="131" fill="#9aa7b6" font-size="14">Interosseous band is the thickest and strongest (5–7 mm);</text><text x="352" y="157" fill="#9aa7b6" font-size="14">dorsal and plantar bands complete the complex.</text><rect x="330" y="171" width="14" height="14" rx="3" fill="#c9d1da"/><text x="352" y="183" fill="#e6ebf1" font-size="14">M2 base sits recessed between C1 and C3, like a keystone.</text><text x="352" y="209" fill="#9aa7b6" font-size="14">There is no ligament between the bases of M1 and M2.</text><rect x="330" y="223" width="14" height="14" rx="3" fill="#5cc8da"/><text x="352" y="235" fill="#e6ebf1" font-size="14">AP view: the medial edge of M2 lines up with the medial edge of C2.</text><text x="352" y="261" fill="#9aa7b6" font-size="14">Oblique view: medial M3 with medial C3, medial M4 with medial cuboid.</text><text x="330" y="301" fill="#9aa7b6" font-size="13">M1–M3 articulate with the three cuneiforms; M4–M5 with the cuboid.</text><text x="30" y="400" fill="#5d6977" font-size="11.5">Schematic, right foot, dorsal view. Not to scale.</text></svg>