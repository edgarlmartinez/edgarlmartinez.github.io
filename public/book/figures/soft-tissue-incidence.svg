<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Inter, system-ui, sans-serif"><rect width="900" height="330" fill="#0b0f14"/><text x="30" y="40" fill="#e6ebf1" font-size="18" font-weight="600">For every soft-tissue sarcoma, there are about 60 benign soft-tissue tumors</text><rect x="30" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="56" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="82" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="108" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="134" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="160" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="186" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="212" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="238" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="264" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="290" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="316" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="342" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="368" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="394" y="70" width="20" height="20" rx="4" fill="#4fae78"/><rect x="30" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="56" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="82" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="108" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="134" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="160" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="186" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="212" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="238" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="264" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="290" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="316" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="342" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="368" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="394" y="96" width="20" height="20" rx="4" fill="#4fae78"/><rect x="30" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="56" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="82" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="108" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="134" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="160" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="186" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="212" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="238" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="264" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="290" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="316" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="342" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="368" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="394" y="122" width="20" height="20" rx="4" fill="#4fae78"/><rect x="30" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="56" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="82" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="108" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="134" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="160" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="186" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="212" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="238" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="264" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="290" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="316" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="342" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="368" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="394" y="148" width="20" height="20" rx="4" fill="#4fae78"/><rect x="460" y="70" width="20" height="20" rx="4" fill="#e06c6c"/><text x="30" y="200" fill="#7fd6a0" font-size="26" font-weight="700">≈ 3,000</text><text x="30" y="224" fill="#9aa7b6" font-size="14">benign soft-tissue tumors per million people per year</text><text x="30" y="244" fill="#9aa7b6" font-size="14">(about 300 per 100,000)</text><text x="460" y="200" fill="#f3a3a3" font-size="26" font-weight="700">≈ 50</text><text x="460" y="224" fill="#9aa7b6" font-size="14">soft-tissue sarcomas per million per year</text><text x="460" y="244" fill="#9aa7b6" font-size="14">(about 1% of all malignant tumors)</text><text x="30" y="290" fill="#e6ebf1" font-size="14">Each square = 50 new tumors per million per year. Most lumps are benign; your job is to find the one that is not.</text><text x="30" y="315" fill="#5d6977" font-size="11.5">Figures from the author's soft-tissue mass lecture. Estimates vary between sources (published ratios range from about 60:1 to 100:1).</text></svg>