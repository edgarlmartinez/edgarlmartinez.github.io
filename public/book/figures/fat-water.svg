<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, system-ui, sans-serif"><rect width="900" height="460" fill="#0b0f14"/><text x="430" y="40" text-anchor="middle" fill="#e9f1f8" font-size="15" font-weight="600">T1</text><text x="590" y="40" text-anchor="middle" fill="#e9f1f8" font-size="15" font-weight="600">T2 (fast spin echo)</text><text x="750" y="40" text-anchor="middle" fill="#e9f1f8" font-size="15" font-weight="600">Fat-suppressed T2 / STIR</text><text x="30" y="98" fill="#e6ebf1" font-size="15">Fat (subcutaneous, fatty marrow)</text><rect x="370" y="60" width="120" height="58" rx="8" fill="#f2f2f2" stroke="#3a4450"/><rect x="530" y="60" width="120" height="58" rx="8" fill="#d6d6d6" stroke="#3a4450"/><rect x="690" y="60" width="120" height="58" rx="8" fill="#1e1e1e" stroke="#3a4450"/><text x="30" y="170" fill="#e6ebf1" font-size="15">Water (fluid, edema, abscess)</text><rect x="370" y="132" width="120" height="58" rx="8" fill="#2a2a2a" stroke="#3a4450"/><rect x="530" y="132" width="120" height="58" rx="8" fill="#f5f5f5" stroke="#3a4450"/><rect x="690" y="132" width="120" height="58" rx="8" fill="#ffffff" stroke="#3a4450"/><text x="30" y="242" fill="#e6ebf1" font-size="15">Marrow replaced by tumor or infection</text><rect x="370" y="204" width="120" height="58" rx="8" fill="#3a3a3a" stroke="#3a4450"/><rect x="530" y="204" width="120" height="58" rx="8" fill="#bdbdbd" stroke="#3a4450"/><rect x="690" y="204" width="120" height="58" rx="8" fill="#e6e6e6" stroke="#3a4450"/><text x="30" y="314" fill="#e6ebf1" font-size="15">Skeletal muscle (internal reference)</text><rect x="370" y="276" width="120" height="58" rx="8" fill="#6e6e6e" stroke="#3a4450"/><rect x="530" y="276" width="120" height="58" rx="8" fill="#4a4a4a" stroke="#3a4450"/><rect x="690" y="276" width="120" height="58" rx="8" fill="#4f4f4f" stroke="#3a4450"/><text x="30" y="386" fill="#e6ebf1" font-size="15">Tendon, ligament, meniscus, cortex</text><rect x="370" y="348" width="120" height="58" rx="8" fill="#0a0a0a" stroke="#3a4450"/><rect x="530" y="348" width="120" height="58" rx="8" fill="#0a0a0a" stroke="#3a4450"/><rect x="690" y="348" width="120" height="58" rx="8" fill="#0a0a0a" stroke="#3a4450"/><text x="30" y="440" fill="#9aa7b6" font-size="13">Read T1 for fat (anatomy, marrow). Read fluid-sensitive images for water (edema, tears, fluid). Schematic gray levels.</text></svg>