<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, sans-serif"><rect width="900" height="560" fill="#0b0f14"/><text x="30" y="36" fill="#7fd6a0" font-size="18" font-weight="700">Reassuring: you can often name it</text><circle cx="90" cy="110" r="44" fill="#f2f5f8"/><circle cx="90" cy="110" r="37" fill="#e9cf6f"/><path d="M68 136 V88 q0 -8 8 -8" stroke="#2d3df0" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M84 134 q-6 -14 6 -18 q12 -4 6 -18" stroke="#2d3df0" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M98 128 q10 -12 18 -2 q6 8 12 -10" stroke="#2d3df0" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="68" cy="100" r="4" fill="#fff"/><circle cx="92" cy="104" r="4" fill="#fff"/><circle cx="116" cy="116" r="4" fill="#fff"/><circle cx="82" cy="130" r="4" fill="#fff"/><text x="90" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Phleboliths, varicose</text><text x="90" y="199" text-anchor="middle" fill="#9aa7b6" font-size="12">channels, fatty atrophy</text><circle cx="234" cy="110" r="44" fill="#5b7bd6" stroke="#fff" stroke-width="2"/><text x="234" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Fluid-like content</text><circle cx="378" cy="110" r="44" fill="#8a6624"/><text x="378" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Fibrous matrix</text><text x="378" y="199" text-anchor="middle" fill="#9aa7b6" font-size="12">(dark on T1 and T2)</text><circle cx="522" cy="110" r="44" fill="#f5ea3c"/><text x="522" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Fat-like content</text><circle cx="666" cy="110" r="40" fill="none" stroke="#d9301e" stroke-width="8"/><circle cx="652" cy="120" r="8" fill="#d9301e"/><circle cx="672" cy="120" r="8" fill="#d9301e"/><circle cx="684" cy="92" r="9" fill="#d9301e"/><text x="666" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Blood products</text><circle cx="810" cy="110" r="44" fill="none" stroke="#fff" stroke-width="3"/><text x="810" y="182" text-anchor="middle" fill="#e6ebf1" font-size="13">Peripheral</text><text x="810" y="199" text-anchor="middle" fill="#9aa7b6" font-size="12">calcification</text><path d="M20 268 H880" stroke="#6b7480" stroke-width="5" stroke-dasharray="40 18"/><circle cx="450" cy="268" r="40" fill="#9a9a9a"/><text x="450" y="290" text-anchor="middle" fill="#111" font-size="62" font-weight="800">?</text><text x="450" y="330" text-anchor="middle" fill="#e8d98c" font-size="15" font-weight="700">Indeterminate</text><text x="450" y="349" text-anchor="middle" fill="#9aa7b6" font-size="12.5">cannot be named: follow-up, MRI or biopsy plan</text><text x="30" y="395" fill="#f3a3a3" font-size="18" font-weight="700">Worrying: think sarcoma</text><polygon points="254,465 231,472 249,488 225,485 234,507 214,494 212,518 200,497 188,518 186,494 166,507 175,485 151,488 169,472 146,465 169,458 151,442 175,445 166,423 186,436 188,412 200,433 212,412 214,436 234,423 225,445 249,442 231,458" fill="#8f1fff" stroke="#c77dff" stroke-width="2" stroke-dasharray="2 4"/><path d="M182 457 a7 7 0 0 1 12 0" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="4 2" transform="rotate(0 188 457)"/><path d="M204 473 a7 7 0 0 1 12 0" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="4 2" transform="rotate(120 210 473)"/><path d="M208 449 a7 7 0 0 1 12 0" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="4 2" transform="rotate(240 214 449)"/><path d="M670 435 q-10 -20 -2 -34 q8 -12 0 -22" stroke="#e0301e" stroke-width="3.5" fill="none"/><path d="M730 435 q16 -10 24 -26 q6 -10 18 -12" stroke="#e0301e" stroke-width="3.5" fill="none"/><path d="M664 491 q-24 6 -30 24 q-6 14 -24 14" stroke="#e0301e" stroke-width="3.5" fill="none"/><path d="M734 495 q14 14 30 12" stroke="#e0301e" stroke-width="3.5" fill="none"/><circle cx="700" cy="465" r="42" fill="#8e4f7a"/><circle cx="700" cy="465" r="42" fill="none" stroke="#e0301e" stroke-width="8" stroke-dasharray="40 8 22 8"/><text x="290" y="460" fill="#e6ebf1" font-size="13.5">Irregular, infiltrative borders,</text><text x="290" y="478" fill="#e6ebf1" font-size="13.5">dystrophic calcification</text><text x="790" y="460" fill="#e6ebf1" font-size="13.5" text-anchor="end"></text><text x="620" y="470" text-anchor="end" fill="#e6ebf1" font-size="13.5">Solid and highly vascular</text><text x="30" y="550" fill="#5d6977" font-size="11.5">Icons redrawn from the author's lecture slides.</text></svg>