edullary, darker than muscle</text><text x="745" y="356" text-anchor="middle" fill="#f3a3a3" font-size="13" font-weight="600">fat is gone</text><text x="40" y="400" fill="#9aa7b6" font-size="13">Schematic T1-weighted images. Gray square = muscle, the internal reference. STIR is bright in all three abnormal states; T1 separates them.</text><text x="40" y="420" fill="#5d6977" font-size="11.5">Pattern after Johnson, Collins and Wenger, AJR 2009 (confluent medullary T1 hypointensity: sensitivity 95%, specificity 91%).</text></svg>