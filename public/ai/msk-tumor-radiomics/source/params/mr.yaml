# MRI: arbitrary units. N4 + z-score done before (see radiomics_pipeline.py); fixed bin number (IBSI).
# Thick, variable slices (4-15 mm) -> in-plane resampling and 2D texture aggregated over slices.
imageType:
  Original: {}
featureClass:
  shape:
  firstorder:
  glcm:
  glrlm:
  glszm:
  gldm:
  ngtdm:
setting:
  interpolator: sitkBSpline
  resampledPixelSpacing: [1, 1, 0]
  padDistance: 10
  resegmentRange: [-3, 3]       # z-scored intensities: 3-SD outlier removal
  resegmentMode: absolute
  binCount: 32
  force2D: true
  force2Ddimension: 0
  label: 1
  geometryTolerance: 0.001
