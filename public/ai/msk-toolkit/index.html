<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>MSK Measurement Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sticky region tabs over a two-column grid of calculator cards; cases and references are their own views. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --ink:#14202b; --muted:#566676; --line:#d5dde4;
  --accent:#0d7468; --accent-ink:#ffffff; --accent-soft:#d9eeeb;
  --bone:#e4e8ec; --bone-edge:#8796a5;
  --ok:#1b7243; --ok-bg:#e0f2e7; --info:#38597a; --info-bg:#e3ebf4; --warn:#8f5400; --warn-bg:#fbedd3; --alert:#ad2a20; --alert-bg:#f8e0dd;
  --seg-ok:#86c9a1; --seg-info:#a9bdd2; --seg-warn:#f1bd66; --seg-alert:#e98c82;
  --canvas:#070a0e;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#131b24; --surface-2:#1a2430; --ink:#dce5ed; --muted:#8c9cad; --line:#283544;
  --accent:#4fd3be; --accent-ink:#052b25; --accent-soft:#12352f;
  --bone:#2a3644; --bone-edge:#8fa1b3;
  --ok:#72d39c; --ok-bg:#112e1e; --info:#9fbad8; --info-bg:#172638; --warn:#f2bd62; --warn-bg:#33260e; --alert:#ff8d82; --alert-bg:#3a1613;
  --seg-ok:#3c8f61; --seg-info:#56718f; --seg-warn:#b9852a; --seg-alert:#b9554c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#131b24; --surface-2:#1a2430; --ink:#dce5ed; --muted:#8c9cad; --line:#283544;
  --accent:#4fd3be; --accent-ink:#052b25; --accent-soft:#12352f;
  --bone:#2a3644; --bone-edge:#8fa1b3;
  --ok:#72d39c; --ok-bg:#112e1e; --info:#9fbad8; --info-bg:#172638; --warn:#f2bd62; --warn-bg:#33260e; --alert:#ff8d82; --alert-bg:#3a1613;
  --seg-ok:#3c8f61; --seg-info:#56718f; --seg-warn:#b9852a; --seg-alert:#b9554c;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;font-weight:600}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:14px 10px}
.top h1{font-size:22px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;flex-basis:100%;max-width:70ch}
.ruo{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--alert);background:var(--alert-bg);border-radius:4px;padding:3px 8px}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:8px 6px;flex:none}

main{padding-block:20px 48px}
.view-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:16px}
.view-head h2{font-size:20px}
.view-head p{margin:0;color:var(--muted);max-width:75ch;flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px;align-items:start}

/* calculator card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-head h3{font-size:17px;flex:1}
.chip{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.vary{background:var(--warn-bg);color:var(--warn)}
.how{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.how p{margin:0;color:var(--muted);font-size:13px}
.dg{width:100%;height:auto;background:var(--surface-2);border-radius:8px;display:block}
.dg .bn{fill:var(--bone);stroke:var(--bone-edge);stroke-width:1.4}
.dg .bs{fill:none;stroke:var(--bone-edge);stroke-linecap:round}
.dg .ms{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.dg .ma{fill:none;stroke:var(--accent);stroke-width:1.6;marker-start:url(#ah);marker-end:url(#ah)}
.dg .rf{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.dg .pt{fill:var(--accent)}
.dg text{font-family:var(--f-mono);font-size:10px;fill:var(--ink)}
.dg text.m{fill:var(--accent);font-weight:500}
.dg text.s{fill:var(--muted);font-size:9px}
.dg .dark{fill:var(--canvas)}
.dg .roi{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 2}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field label em{font-style:normal;opacity:.75;font-weight:400}
.ctl{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.ctl:focus-within{border-color:var(--accent)}
.ctl input,.ctl select{border:0;background:transparent;padding:6px 8px;min-width:0;flex:1;width:100%}
.ctl input{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ctl input:focus,.ctl select:focus{outline:none}
.ctl .unit{padding:6px 8px 6px 0;color:var(--muted);font-family:var(--f-mono);font-size:12px;align-self:center}
.ctl .meas{border:0;border-left:1px solid var(--line);background:var(--surface-2);padding:0 8px;cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}
.ctl .meas:hover{background:var(--accent-soft)}
.check{flex-direction:row;align-items:center;gap:8px;grid-column:span 1;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check label{color:var(--ink);font-size:13px;font-weight:400}
.results{display:flex;flex-direction:column;gap:10px}
.res{border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.res .rl{font-size:12px;color:var(--muted);font-weight:500}
.res .rv{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.res .rv small{font-size:13px;color:var(--muted)}
.res .empty{color:var(--muted);font-size:12px;grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border-radius:5px;padding:2px 8px;justify-self:start}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev-ok{color:var(--ok);background:var(--ok-bg)} .sev-info{color:var(--info);background:var(--info-bg)}
.sev-warn{color:var(--warn);background:var(--warn-bg)} .sev-alert{color:var(--alert);background:var(--alert-bg)}
.res .note{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:0}
.bar{grid-column:1/-1;position:relative;height:30px;margin-top:2px}
.bar .segs{position:absolute;inset:0 0 auto;height:8px;display:flex;border-radius:4px;overflow:hidden}
.bar .segs span{height:100%;opacity:.9}
.bar .segs span+span{border-left:2px solid var(--surface)}
.seg-ok{background:var(--seg-ok)}.seg-info{background:var(--seg-info)}.seg-warn{background:var(--seg-warn)}.seg-alert{background:var(--seg-alert)}
.bar .mk{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.bar .tk{position:absolute;top:11px;font-family:var(--f-mono);font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flags li{font-size:13px;border-radius:6px;padding:7px 10px 7px 12px;border-left:3px solid currentColor}
.flags li span{color:var(--ink)}
details.pit{font-size:13px}
details.pit summary{cursor:pointer;color:var(--muted);font-weight:500}
details.pit ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.card-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.card-foot .srcs{flex:1;min-width:0}
.card-foot a{text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.05)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table.ref{border-collapse:collapse;font-size:12.5px;width:100%}
table.ref th,table.ref td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.ref th{color:var(--muted);font-weight:500}
.example{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:6px 10px}

/* measure */
.measure{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.stage{background:var(--canvas);border-radius:10px;overflow:hidden;position:relative;touch-action:none;height:min(72vh,680px);min-height:360px}
.stage canvas{display:block;width:100%;height:100%;cursor:crosshair}
.stage .hint{position:absolute;left:10px;bottom:10px;right:10px;font-size:12px;color:#cfd8e0;background:rgba(7,10,14,.7);padding:6px 10px;border-radius:6px;pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel h3{font-size:14px}
.toolrow{display:flex;flex-wrap:wrap;gap:6px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.mlist li b{font-family:var(--f-mono);font-weight:500}
.mlist li .grow{flex:1}
.panel small{color:var(--muted)}
.panel .ctl{background:var(--bg)}
.rowc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=range]{accent-color:var(--accent);width:100%}

/* cases */
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.regions button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.regions button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.regions button:disabled{opacity:.45;cursor:default}
.regions button .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.region-sec{margin-bottom:28px}
.region-sec>h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-bottom:16px}
.case h4{font-family:var(--f-head);font-size:18px;margin:0 0 4px;font-weight:600}
.case .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.case p{margin:0 0 10px;max-width:68ch}
.case ul.tp{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:70ch}
.case h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;font-weight:600}
.case ol.cr{margin:0;padding-left:20px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start}
.gallery figure{margin:0;background:var(--canvas);border-radius:8px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
.gallery img{width:100%;height:170px;object-fit:contain;display:block}
.gallery figcaption{font-size:11.5px;color:#cdd6de;padding:5px 8px;background:#0e141b}
.lightbox{position:fixed;inset:0;background:rgba(5,8,12,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:80vh;object-fit:contain}
.lightbox p{color:#dfe6ec;margin:0;font-size:13px;text-align:center;max-width:70ch}
.lightbox .row{display:flex;gap:8px}
.lightbox .btn{background:#1b2530;color:#e6edf2;border-color:#33414f}
.refs-list ol{padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:95ch}
.refs-list h3{font-size:15px;margin:20px 0 8px}
.refs-list li{font-size:13px}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:28px;max-width:90ch}

@media (max-width:860px){.measure{grid-template-columns:1fr}.case{grid-template-columns:1fr}}
@media (max-width:520px){.how{grid-template-columns:1fr}.how svg{max-width:240px}.top h1{font-size:19px}.ver{margin-left:0}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
</defs></svg>

<header class="top"><div class="wrap">
  <h1>MSK Measurement Toolkit</h1><span class="ruo">Research &amp; education only</span><span class="ver" id="ver"></span>
  <p class="sub">Literature-based normal ranges, grading and interpretation for common musculoskeletal measurements, with a measure-on-image tool<span id="subcases"> and a teaching case file</span>. Every threshold links to its source.</p>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="main"></main>

<!-- =====================================================================
     TOOLKIT DATA — edit this block to change cutoffs, add measurements,
     add cases or references. The engine further down never needs editing.

     How to add a measurement: copy any object inside a module's
     `calculators: [ ... ]`, give it a new `id`, then edit:
       inputs   – fields the user fills in (type: number | select | check)
                  add measure:'angle' | 'tilt' | 'length' to show a
                  "Measure" button that links to the image tool
       results  – each has calc(v) returning a number (v = input values,
                  null when empty) and either `bands` (ordered cutoffs:
                  value < upTo, or <= upTo when incl:true; last band has
                  no upTo) or classify(x, v) returning {label, sev, note}
                  sev is one of ok | info | warn | alert
       flags    – extra findings: {when:(v,r)=>true/false, sev, text, refs}
       refs     – keys from REFERENCES below
       diagram  – inner SVG markup for a 200 x 140 schematic
       vary:true – shows a "cutoffs vary" chip where studies disagree

     How to add a case: add an object to CASES (region must match one of
     REGIONS), put its images in the cases/ folder next to this file.
     ===================================================================== -->
<script>
const TOOLKIT_META = { version: '1.0', reviewed: '2026-11-22', author: 'Edgar L. Martinez, MD', showCases: false };

const has = x => x !== null && x !== undefined && !(typeof x === 'number' && isNaN(x));
const sum = (...a) => a.reduce((s, x) => s + (x || 0), 0);

/* ---------- shared diagram pieces ---------- */
const DG = {
  chemShift: (extra = '') => `
    <rect x="12" y="22" width="80" height="80" rx="6" class="bn"/><text x="52" y="16" text-anchor="middle">in-phase</text>
    <rect x="108" y="22" width="80" height="80" rx="6" class="bn"/><text x="148" y="16" text-anchor="middle">opposed-phase</text>
    <circle cx="52" cy="62" r="20" style="fill:var(--bone-edge)" opacity=".85"/><circle cx="52" cy="62" r="13" class="roi"/>
    <circle cx="148" cy="62" r="20" style="fill:var(--bone-edge)" opacity=".35"/><circle cx="148" cy="62" r="13" class="roi"/>
    ${extra}
    <text x="100" y="124" text-anchor="middle" class="m">(IP − OP) / IP × 100</text>`
};

/* ---------- Lonstein & Carlson 1984 progression table ---------- */
const LONSTEIN = [
  { cobb: [5, 19],  risser: [0, 1], pct: 22 },
  { cobb: [20, 29], risser: [0, 1], pct: 68 },
  { cobb: [5, 19],  risser: [2, 4], pct: 1.6 },
  { cobb: [20, 29], risser: [2, 4], pct: 23 }
];
const lonstein = v => {
  if (!has(v.cobb) || !has(v.risser)) return null;
  const row = LONSTEIN.find(r => v.cobb >= r.cobb[0] && v.cobb <= r.cobb[1] && v.risser >= r.risser[0] && v.risser <= r.risser[1]);
  return row ? row.pct : null;
};

/* ======================= MEASUREMENT MODULES ======================= */
const MODULES = [
/* ------------------------------------------------------------------ */
{ id: 'spine', tab: 'Spine', title: 'Scoliosis & sagittal alignment',
  blurb: 'Standing PA and lateral full-length spine radiographs. Measure on the same projection and the same end vertebrae as the prior study when comparing.',
  calculators: [
  { id: 'cobb', title: 'Coronal Cobb angle',
    howTo: 'Choose the end vertebrae: the most tilted vertebrae at the top and bottom of the curve. Draw a line along the superior endplate of the upper end vertebra and the inferior endplate of the lower end vertebra. The Cobb angle is the angle between the two lines.',
    diagram: `
      <g class="bn"><rect x="74" y="16" width="40" height="18" rx="3" transform="rotate(-14 94 25)"/><rect x="84" y="44" width="40" height="18" rx="3" transform="rotate(-4 104 53)"/><rect x="88" y="72" width="40" height="18" rx="3" transform="rotate(6 108 81)"/><rect x="78" y="100" width="40" height="18" rx="3" transform="rotate(14 98 109)"/></g>
      <line x1="34" y1="30.8" x2="150" y2="1.8" class="ms"/><line x1="38" y1="103.2" x2="154" y2="132.2" class="ms"/>
      <text x="8" y="70" class="m">Cobb</text><text x="8" y="82" class="s">angle between</text><text x="8" y="92" class="s">endplate lines</text>`,
    inputs: [
      { id: 'cobb', label: 'Cobb angle', unit: '°', value: 28, measure: 'angle' },
      { id: 'prior', label: 'Prior Cobb angle', unit: '°', optional: true, value: 22, measure: 'angle' },
      { id: 'risser', label: 'Risser grade', type: 'select', optional: true, value: '1',
        options: [['', 'Not assessed'], ['0', '0 · no ossification'], ['1', '1 · up to 25%'], ['2', '2 · 26–50%'], ['3', '3 · 51–75%'], ['4', '4 · 76–100%'], ['5', '5 · fused']] },
      { id: 'age', label: 'Age', unit: 'y', optional: true, value: 12 }
    ],
    results: [
      { id: 'mag', label: 'Curve magnitude', unit: '°', calc: v => v.cobb, scale: [0, 80], bands: [
        { upTo: 10, label: 'Below scoliosis threshold', sev: 'ok', note: 'Curves under 10° are spinal asymmetry, not scoliosis.' },
        { upTo: 25, label: 'Mild scoliosis', sev: 'info', note: 'Usually observed with serial radiographs.' },
        { upTo: 40, incl: true, label: 'Moderate scoliosis', sev: 'warn', note: 'Bracing range (25–40°) in skeletally immature patients.' },

        { label: 'Severe scoliosis (50° or more)', sev: 'alert', note: 'Thoracic curves of 50–75° at maturity progress about 1° per year in adulthood.' } ] },

    ],

      { when: v => lonstein(v) !== null, sev: 'info',

    tables: [

      { title: 'Nash–Moe vertebral rotation (convex pedicle)', head: ['Grade', 'Appearance on PA view'], rows: [['0', 'Pedicles symmetric'], ['1', 'Convex pedicle shifts toward midline; concave pedicle starts to fade'], ['2', 'Convex pedicle in second third of the hemibody; concave pedicle fading'], ['3', 'Convex pedicle at the midline; concave pedicle not visible'], ['4', 'Convex pedicle past the midline']] }
    ],
    refs: ['kane1977', 'cobb1948', 'weinstein2008', 'weinstein1983', 'morrissy1990', 'carman1990', 'risser1958', 'nashmoe1969'] },

  { id: 'kyph', title: 'Thoracic kyphosis', vary: true,

    flags: [

      { when: v => has(v.k) && v.k > 45 && !has(v.wedge), sev: 'info', text: 'Over 45°: check for 3 or more adjacent wedged vertebrae, endplate irregularity and Schmorl nodes (Scheuermann).', refs: ['sorensen1964'] }
    ],

  { id: 'sag', title: 'Lumbar lordosis & spinopelvic (SRS–Schwab)',
    howTo: 'Lumbar lordosis: L1 superior to S1 superior endplate. Pelvic incidence (PI): angle between the perpendicular to the S1 endplate at its midpoint and the line to the femoral head center. Pelvic tilt (PT): that line versus vertical. SVA: horizontal offset of the C7 plumb line from the posterosuperior S1 corner (positive = anterior).',
    diagram: `
      <polygon points="90,60 130,35 152,80 142,126 126,120 104,90" class="bn"/>

    inputs: [

      { id: 'pi', label: 'Pelvic incidence', unit: '°', value: 58, optional: true, measure: 'angle' },
      { id: 'pt', label: 'Pelvic tilt', unit: '°', value: 24, optional: true, measure: 'angle' },
      { id: 'sva', label: 'SVA (+ anterior)', unit: 'mm', value: 52, optional: true, measure: 'length' }
    ],
    results: [
      { id: 'll', label: 'Lumbar lordosis', unit: '°', calc: v => v.ll, scale: [0, 90], bands: [
        { upTo: 40, label: 'Below the typical adult range', sev: 'info', note: 'Interpret against pelvic incidence: lordosis should be within about 10° of PI.' },
        { upTo: 60, incl: true, label: 'Typical adult range (40–60°)', sev: 'ok', note: 'Wide normal range; PI determines the ideal lordosis for each patient.' },
        { label: 'Above the typical adult range', sev: 'info', note: 'May be appropriate if PI is high.' } ] },
      { id: 'mm', label: 'PI − LL mismatch', unit: '°', signed: true, calc: v => has(v.pi) && has(v.ll) ? v.pi - v.ll : null, scale: [-20, 40], bands: [

        { upTo: 20, incl: true, label: 'Modifier + (10–20°)', sev: 'warn', note: 'Moderate sagittal deformity.' },
        { label: 'Modifier ++ (over 20°)', sev: 'alert', note: 'Marked mismatch; associated with disability in adult deformity.' } ] },
      { id: 'pt', label: 'Pelvic tilt modifier', unit: '°', calc: v => v.pt, scale: [0, 45], bands: [
        { upTo: 20, label: 'Modifier 0 (under 20°)', sev: 'ok' },
        { upTo: 30, incl: true, label: 'Modifier + (20–30°)', sev: 'warn', note: 'Pelvic retroversion compensating for lost lordosis.' },
        { label: 'Modifier ++ (over 30°)', sev: 'alert' } ] },
      { id: 'sva', label: 'SVA modifier', unit: 'mm', calc: v => v.sva, scale: [-40, 140], bands: [
        { upTo: 40, label: 'Modifier 0 (under 4 cm)', sev: 'ok' },
        { upTo: 95, incl: true, label: 'Modifier + (4–9.5 cm)', sev: 'warn' },
        { label: 'Modifier ++ (over 9.5 cm)', sev: 'alert' } ] },
      { id: 'ss', label: 'Derived sacral slope (PI − PT)', unit: '°', calc: v => has(v.pi) && has(v.pt) ? v.pi - v.pt : null }

  { id: 'coronal', title: 'Coronal balance',
    howTo: 'On the standing PA, drop a vertical plumb line from the center of C7 and draw the central sacral vertical line (CSVL) through the middle of S1. Measure the horizontal distance between them.',

  { id: 'rvad', title: 'Rib–vertebra angle difference (Mehta)',

{ id: 'ccj', tab: 'Craniocervical', title: 'Atlantoaxial & craniocervical junction',
  blurb: 'Predental space and the measurements used for atlanto-occipital (craniocervical) dissociation. Radiograph and CT cutoffs differ; use the ones that match the modality.',
  calculators: [
  { id: 'adi', title: 'Atlantodental interval (predental space)',
    howTo: 'On the lateral (or midsagittal CT), measure from the posteroinferior margin of the anterior arch of C1 to the anterior surface of the dens. The posterior atlantodental interval (PADI) is from the posterior dens to the anterior margin of the posterior arch of C1: the space available for the cord.',
    diagram: `
      <ellipse cx="58" cy="50" rx="10" ry="14" class="bn"/>
      <path d="M80,30 q13,-14 26,0 l2,62 l-30,0 z" class="bn"/>
      <rect x="70" y="92" width="48" height="38" rx="4" class="bn"/>
      <ellipse cx="166" cy="50" rx="10" ry="14" class="bn"/>
      <line x1="68" y1="50" x2="80" y2="50" class="ma"/><line x1="107" y1="50" x2="156" y2="50" class="ma"/>
      <text x="60" y="80" class="m">ADI</text><text x="120" y="42" class="m">PADI</text>
      <text x="40" y="22" class="s">C1 ant arch</text><text x="86" y="20" class="s">dens</text><text x="140" y="80" class="s">C1 post arch</text>`,
    inputs: [
      { id: 'adi', label: 'ADI', unit: 'mm', value: 4, measure: 'length' },
      { id: 'padi', label: 'PADI', unit: 'mm', value: 16, optional: true, measure: 'length' },
      { id: 'grp', label: 'Patient', type: 'select', value: 'adult', options: [['adult', 'Adult'], ['child', 'Child']] },
      { id: 'ra', label: 'Inflammatory arthritis (e.g. RA)', type: 'check', value: false }
    ],
    results: [
      { id: 'adi', label: 'Atlantodental interval', unit: 'mm', decimals: 1, calc: v => v.adi, scale: [0, 12],
        bandsBy: v => v.grp === 'child' ? 'child' : 'adult',
        bandSets: {
          adult: [
            { upTo: 3, incl: true, label: 'Normal adult (3 mm or less)', sev: 'ok' },
            { upTo: 5, incl: true, label: 'Widened: transverse ligament insufficiency likely', sev: 'warn', note: '3–5 mm in trauma suggests transverse ligament rupture with intact alar ligaments.' },
            { label: 'Markedly widened: transverse and alar ligaments', sev: 'alert', note: 'Over 5 mm suggests transverse plus alar ligament failure.' } ],
          child: [
            { upTo: 5, incl: true, label: 'Normal child (5 mm or less)', sev: 'ok' },
            { label: 'Widened for age', sev: 'alert', note: 'Over 5 mm in a child suggests atlantoaxial instability.' } ] } },
      { id: 'padi', label: 'Posterior atlantodental interval', unit: 'mm', decimals: 1, calc: v => v.padi, scale: [0, 30], bands: [
        { upTo: 14, label: 'Reduced (under 14 mm)', sev: 'alert', note: 'In rheumatoid arthritis, PADI under 14 mm predicts paralysis and poorer neurologic recovery.' },
        { label: '14 mm or more', sev: 'ok' } ] }
    ],
    flags: [{ when: v => v.ra && has(v.adi) && v.adi > 9, sev: 'alert', text: 'ADI over 9–10 mm in rheumatoid arthritis is a traditional surgical threshold; PADI is the better predictor.', refs: ['boden1993'] }],
    refs: ['hinck1960', 'locke1966', 'fielding1974', 'boden1993'] },

  { id: 'harris', title: 'Basion–dens & basion–axial intervals', vary: true,
    howTo: 'BDI: distance from the basion to the tip of the dens. BAI: horizontal distance from the basion to the posterior axial line (a line along the posterior cortex of the C2 body extended upward). Positive BAI = basion anterior to the line.',
    diagram: `
      <path d="M8,0 L58,24 L62,34 L10,18 z" class="bn"/>
      <path d="M68,50 q8,-10 18,0 l6,32 l10,6 l0,40 l-46,0 l0,-40 l8,-6 z" class="bn"/>

      <circle cx="60" cy="28" r="2.5" class="pt"/><circle cx="77" cy="43" r="2.5" class="pt"/>
      <line x1="60" y1="28" x2="77" y2="43" class="ma"/><line x1="62" y1="22" x2="101" y2="22" class="ma"/>
      <text x="36" y="48" class="m">BDI</text><text x="68" y="16" class="m">BAI</text><text x="108" y="120" class="s">post. axial line</text><text x="10" y="40" class="s">basion</text>`,
    inputs: [
      { id: 'bdi', label: 'BDI', unit: 'mm', value: 10, measure: 'length' },
      { id: 'bai', label: 'BAI (+ anterior)', unit: 'mm', optional: true, value: 6, measure: 'length' },
      { id: 'mod', label: 'Modality', type: 'select', value: 'ct', options: [['ct', 'CT'], ['xr', 'Radiograph']] }
    ],
    results: [
      { id: 'bdi', label: 'Basion–dens interval', unit: 'mm', decimals: 1, calc: v => v.bdi, scale: [0, 20],
        bandsBy: v => v.mod,
        bandSets: {

               { label: 'Widened on CT (over 8.5 mm)', sev: 'alert', note: 'Suspicious for craniocervical dissociation; correlate with CCI and MRI of the ligaments.' }],
          xr: [{ upTo: 12, incl: true, label: 'Normal on radiograph (12 mm or less)', sev: 'ok', note: 'Harris "rule of 12". Unreliable under age 13 because the dens is not fully ossified.' },

        { label: 'Basion too far anterior (over 12 mm)', sev: 'alert', note: 'Suggests anterior atlanto-occipital dislocation.' } ] }
    ],
    flags: [{ when: v => v.mod === 'ct' && has(v.bai), sev: 'info', text: 'BAI is validated on radiographs; on CT it is less reliable, so rely on BDI and the condyle–C1 interval.', refs: ['rojas2007'] }],
    refs: ['harris1994', 'rojas2007'] },

    ],
    results: [{ id: 't', label: 'Combined overhang', unit: 'mm', decimals: 1, calc: v => has(v.a) && has(v.b) ? v.a + v.b : null, scale: [0, 14],

             { upTo: 8.1, incl: true, label: 'Over 6.9 mm: transverse ligament rupture possible', sev: 'warn', note: 'Correcting for radiographic magnification, 8.1 mm has been proposed.' },

/* ------------------------------------------------------------------ */
{ id: 'cs', tab: 'Chemical shift', title: 'In- and opposed-phase signal drop',
  blurb: 'T1 dual-echo gradient echo. Use identical ROIs on co-registered in-phase (IP) and opposed-phase (OP) images. Ideally the opposed-phase echo is acquired first, so T2* decay cannot fake or hide a drop.',
  calculators: [
  { id: 'marrow', title: 'Bone marrow lesion',
    howTo: 'Place the same ROI in the lesion on the IP and OP images (same slice, same size), avoiding cortex, necrosis and partial volume with adjacent fat. Signal drop = (IP − OP) / IP × 100; ratio = OP / IP.',
    diagram: DG.chemShift(),
    inputs: [
      { id: 'ip', label: 'Lesion SI, in-phase', value: 820 },
      { id: 'op', label: 'Lesion SI, opposed-phase', value: 760 },
      { id: 'field', label: 'Field strength', type: 'select', value: '1.5', options: [['1.5', '1.5 T'], ['3', '3 T']] }
    ],
    results: [
      { id: 'drop', label: 'Signal drop', unit: '%', decimals: 1, signed: true, calc: v => has(v.ip) && has(v.op) && v.ip > 0 ? (v.ip - v.op) / v.ip * 100 : null, scale: [-10, 70], bands: [
        { upTo: 20, label: 'Insufficient drop (under 20%)', sev: 'alert', note: 'OP/IP ratio over 0.80: favors a marrow-replacing process such as neoplasm (95% sensitive, 89% specific).' },
        { label: 'Signal drop of 20% or more', sev: 'ok', note: 'OP/IP ratio 0.80 or less: fat persists among the cells, favoring a non-neoplastic process (red marrow, edema, benign lesion).' } ] },
      { id: 'ratio', label: 'OP / IP ratio', decimals: 2, calc: v => has(v.ip) && has(v.op) && v.ip > 0 ? v.op / v.ip : null }
    ],
    flags: [
      { when: (v, r) => has(r.drop) && r.drop < 0, sev: 'info', text: 'Opposed-phase signal is higher than in-phase. Check ROI registration and echo order; susceptibility from sclerosis, hemosiderin or gas darkens the later in-phase echo.' },
      { when: (v, r) => has(r.drop) && r.drop >= 15 && r.drop < 25, sev: 'info', text: 'Close to the 20% cutoff: weigh morphology, enhancement and diffusion.' }
    ],
    pitfalls: [
      'At 1.5 T the in-phase echo (about 4.6 ms) is later than the opposed-phase echo (about 2.3 ms); sclerotic, hemosiderin-laden or gas-containing lesions lose in-phase signal and can mask a true drop.',
      'Acute benign fractures with extensive edema can show little drop. Correlate with fracture morphology.',
      'Sclerotic metastases can be hard to measure; treated metastases may regain fat.',
      'An adjunct only. It does not replace contrast-enhanced, fluid-sensitive or diffusion imaging.'
    ],
    refs: ['zajick2005', 'disler1997'] },

  { id: 'sii', title: 'Adrenal signal intensity index',
    howTo: 'ROI over at least half to two-thirds of the adrenal mass on IP and OP images, avoiding the edge. SII = (IP − OP) / IP × 100.',
    diagram: DG.chemShift(),
    inputs: [
      { id: 'ip', label: 'Adrenal SI, in-phase', value: 410 },
      { id: 'op', label: 'Adrenal SI, opposed-phase', value: 250 }
    ],
    results: [{ id: 'sii', label: 'Signal intensity index', unit: '%', decimals: 1, signed: true, calc: v => has(v.ip) && has(v.op) && v.ip > 0 ? (v.ip - v.op) / v.ip * 100 : null, scale: [-10, 70], bands: [
      { upTo: 16.5, label: 'Below the adenoma threshold', sev: 'warn', note: 'Not diagnostic of a lipid-rich adenoma. Consider adrenal washout CT, comparison with priors, or follow-up per ACR guidance.' },
      { label: 'Consistent with lipid-rich adenoma (over 16.5%)', sev: 'ok' } ] }],
    pitfalls: [
      'Metastases from intracellular-lipid-containing tumors (hepatocellular and clear cell renal carcinoma) can lose signal.',
      'About 10–30% of adenomas are lipid-poor and will not drop; unenhanced CT under 10 HU is the CT equivalent of a positive test.',
      'Myelolipoma has macroscopic fat (India ink artifact at fat–water interfaces), not intracellular lipid.',
      'The 16.5% cutoff comes from 1.5 T work. At 3 T the usual echo order is reversed, so use the opposed-phase echo before the in-phase echo or a Dixon method.'
    ],
    refs: ['fujiyoshi2003', 'israel2004', 'mayosmith2017'] },

  { id: 'asr', title: 'Adrenal-to-spleen ratio',
    howTo: 'Measure the adrenal mass and the spleen on IP and OP images. ASR = (adrenal OP / spleen OP) ÷ (adrenal IP / spleen IP). Normalizing to spleen corrects for scanner gain between echoes.',
    diagram: DG.chemShift(`<circle cx="76" cy="38" r="7" class="roi"/><circle cx="172" cy="38" r="7" class="roi"/><text x="66" y="96" class="s">spleen ROI</text>`),
    inputs: [
      { id: 'aip', label: 'Adrenal SI, in-phase', value: 410 }, { id: 'aop', label: 'Adrenal SI, opposed-phase', value: 250 },
      { id: 'sip', label: 'Spleen SI, in-phase', value: 300 }, { id: 'sop', label: 'Spleen SI, opposed-phase', value: 310 }
    ],
    results: [{ id: 'asr', label: 'Adrenal-to-spleen ratio', decimals: 2,
      calc: v => [v.aip, v.aop, v.sip, v.sop].every(x => has(x) && x > 0) ? (v.aop / v.sop) / (v.aip / v.sip) : null, scale: [0.3, 1.3], bands: [
      { upTo: 0.71, label: 'Consistent with adenoma (under 0.71)', sev: 'ok' },
      { label: 'Above the adenoma threshold', sev: 'warn', note: 'Not diagnostic of adenoma.' } ] }],
    pitfalls: ['Splenic iron overload (for example transfusional hemosiderosis) invalidates the spleen as a reference; use the SII instead.'],
    refs: ['mayosmith1995', 'fujiyoshi2003'] }
  ] },

{ id: 'shoulder', tab: 'Shoulder', title: 'Acromioclavicular & subacromial',
  blurb: 'AP or Zanca (10–15° cephalic tilt) view for the AC joint; true AP (Grashey) in neutral rotation for the acromiohumeral interval. Compare with the other shoulder when possible.',
  calculators: [
  { id: 'cc', title: 'Coracoclavicular interval & AC joint',
    howTo: 'CC interval: vertical distance from the top of the coracoid to the undersurface of the clavicle. AC joint width: narrowest horizontal gap between the clavicle and acromion. Measure the uninjured side on the same exam for comparison.',
    diagram: `
      <polygon points="12,32 168,26 170,44 12,50" class="bn"/>
      <polygon points="174,26 196,30 196,50 174,44" class="bn"/>
      <path d="M70,118 C70,90 96,74 126,78 L128,88 C106,88 90,98 86,118 Z" class="bn"/>
      <line x1="112" y1="80" x2="112" y2="46" class="ma"/><line x1="170" y1="58" x2="174" y2="58" class="ma"/>
      <text x="118" y="66" class="m">CC</text><text x="160" y="72" class="m">AC</text>
      <text x="14" y="22" class="s">clavicle</text><text x="40" y="132" class="s">coracoid</text><text x="166" y="20" class="s">acromion</text>`,
    inputs: [
      { id: 'cc', label: 'CC interval, injured side', unit: 'mm', value: 18, measure: 'length' },
      { id: 'ccn', label: 'CC interval, other side', unit: 'mm', optional: true, value: 11, measure: 'length' },
      { id: 'ac', label: 'AC joint width', unit: 'mm', optional: true, value: 6, measure: 'length' },
      { id: 'sex', label: 'Sex', type: 'select', value: 'm', options: [['m', 'Male'], ['f', 'Female']] }
    ],
    results: [
      { id: 'cc', label: 'CC interval', unit: 'mm', decimals: 1, calc: v => v.cc, scale: [0, 30], bands: [
        { upTo: 13, incl: true, label: 'Within normal range (11–13 mm)', sev: 'ok' },
        { label: 'Increased CC interval', sev: 'warn', note: 'Compare with the other side to grade the injury.' } ] },
      { id: 'pct', label: 'Increase over other side', unit: '%', signed: true, calc: v => has(v.cc) && has(v.ccn) && v.ccn > 0 ? (v.cc - v.ccn) / v.ccn * 100 : null, scale: [0, 320], bands: [
        { upTo: 25, label: 'Under 25%: Rockwood type I–II range', sev: 'info', note: 'Type II has a widened AC joint with a normal or slightly increased CC interval.' },
        { upTo: 100, incl: true, label: '25–100%: Rockwood type III range', sev: 'warn' },
        { upTo: 300, incl: true, label: '100–300%: Rockwood type V range', sev: 'alert' },
        { label: 'Over 300%', sev: 'alert' } ] },
      { id: 'diff', label: 'Side-to-side difference', unit: 'mm', signed: true, decimals: 1, calc: v => has(v.cc) && has(v.ccn) ? v.cc - v.ccn : null,
        classify: d => d >= 5 ? { label: '5 mm or more: complete CC ligament disruption likely', sev: 'alert' } : { label: 'Under 5 mm', sev: 'info' } },
      { id: 'ac', label: 'AC joint width', unit: 'mm', decimals: 1, calc: v => v.ac,
        classify: (x, v) => { const lim = v.sex === 'f' ? 6 : 7; return x > lim ? { label: `Widened (over ${lim} mm)`, sev: 'warn', note: 'A side-to-side difference over 2–3 mm also suggests injury.' } : { label: `Normal width (${lim} mm or less)`, sev: 'ok' }; } }
    ],
    flags: [
      { when: (v, r) => has(r.pct) && r.pct >= 40 && r.pct < 50, sev: 'info', text: 'A 40–50% increase over the other side was described as indicating complete CC ligament disruption.', refs: ['bearden1973'] },
      { when: (v, r) => has(r.pct) && r.pct >= 25, sev: 'info', text: 'Types IV (posterior) and VI (inferior) displacement need an axillary view or CT; the CC interval alone cannot show them.' }
    ],
    refs: ['bearden1973', 'rockwood1984', 'petersson1983', 'ernberg2003'] },

  { id: 'ahi', title: 'Acromiohumeral interval & Hamada grade',
    howTo: 'On an AP radiograph in neutral rotation, measure the shortest distance from the undersurface of the acromion (dense cortical line) to the top of the humeral head.',
    diagram: `
      <path d="M30,18 L176,18 L176,32 L30,32 Z" class="bn"/>
      <circle cx="104" cy="86" r="38" class="bn"/>
      <path d="M56,62 Q46,86 56,110" class="bs" stroke-width="6"/>

    ],
    results: [
      { id: 'ahi', label: 'Acromiohumeral interval', unit: 'mm', decimals: 1, calc: v => v.ahi, scale: [0, 20], bands: [
        { upTo: 5, incl: true, label: 'Markedly reduced (5 mm or less)', sev: 'alert', note: 'Strongly associated with a massive cuff tear involving infraspinatus and fatty degeneration.' },
        { upTo: 7, label: 'Reduced (under 7 mm)', sev: 'warn', note: '7 mm or less is associated with full-thickness supraspinatus tears.' },

          : v.acet ? { label: 'Grade 3', sev: 'alert', note: 'Acetabularization: concave deformity of the acromial undersurface.' }
          : v.ahi <= 5 ? { label: 'Grade 2', sev: 'warn', note: 'AHI 5 mm or less.' }
          : { label: 'Grade 1', sev: 'ok', note: 'AHI 6 mm or more.' }, hideValue: true }
    ],
    refs: ['weiner1970', 'golding1962', 'saupe2006', 'hamada1990', 'hamada2011'] }
  ] },

{ id: 'hip', tab: 'Pelvis & hip', title: 'Pelvic stability, acetabular coverage & FAI',

  { id: 'lcea', title: 'Lateral center-edge angle (Wiberg)',

const refFull = k => { const r = REFERENCES[k]; return r ? `${r.a ? r.a + ' ' : ''}${r.t} ${r.j}` : k; };
const refLink = k => REFERENCES[k] ? `<a href="${esc(refUrl(k))}" target="_blank" rel="noopener" title="${esc(refFull(k))}">${esc(REFERENCES[k].s)}</a>` : `<span title="missing reference">${esc(k)}?</span>`;

let current = null;
function go(id, opts = {}) {
  if (!VIEWS.some(v => v.id === id)) id = MODULES[0].id;

  $$('button[data-view]', tabs).forEach(b => b.setAttribute('aria-selected', b.dataset.view === id));

function compute(c) {

      <div class="meta"><span class="chip">${esc(c.region)}</span>${(c.alsoIn || []).map(r => `<span class="chip">${esc(r)}</span>`).join('')}<span class="chip">${esc(c.modality)}</span><span class="chip">${esc(c.added)}</span></div>
      <p>${esc(c.findings)}</p>
      ${c.calc && CALCS[c.calc.id] ? `<p><button type="button" class="btn primary" data-loadcalc="${c.id}">${esc(c.calc.label)}</button></p>` : ''}
      <h5>Teaching points</h5><ul class="tp">${c.teaching.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <h5>References</h5><ol class="cr">${c.refs.map(k => `<li><a href="${esc(refUrl(k))}" target="_blank" rel="noopener">${esc(refFull(k))}</a></li>`).join('')}</ol>
    </div>
    <div class="gallery">${c.images.map((im, n) => `<figure data-case="${c.id}" data-n="${n}" tabindex="0" role="button" aria-label="Enlarge ${esc(im.caption)}"><img src="${esc(im.src)}" alt="${esc(im.caption)}" loading="lazy"><figcaption>${esc(im.caption)}</figcaption></figure>`).join('')}</div>
  </article>`;
}
function renderCases() {
  const regs = REGIONS.filter(r => counts[r] && (regionFilter === 'All' || regionFilter === r));
  cv2.innerHTML = `<div class="view-head"><h2>Interesting cases</h2><p>Teaching cases by body region, each with key images, teaching points and references. Images are de-identified.</p></div>
    <div class="regions" role="group" aria-label="Filter by region"><button aria-pressed="${regionFilter === 'All'}" data-r="All">All<span class="n">${CASES.length}</span></button>${REGIONS.map(r => `<button data-r="${esc(r)}" aria-pressed="${regionFilter === r}" ${counts[r] ? '' : 'disabled'}>${esc(r)}<span class="n">${counts[r]}</span></button>`).join('')}</div>
    ${regs.map(r => `<div class="region-sec"><h3>${esc(r)}</h3>${CASES.filter(c => regionFilter === 'All' ? c.region === r : inRegion(c, r)).map(caseHTML).join('')}</div>`).join('')}`;
}
if (TOOLKIT_META.showCases) { renderCases(); main.appendChild(cv2); }
cv2.addEventListener('click', e => {
  const b = e.target.closest('[data-r]'); if (b && !b.disabled) { regionFilter = b.dataset.r; renderCases(); return; }
  const lc = e.target.closest('[data-loadcalc]');
  if (lc) {
    const cs = CASES.find(x => x.id === lc.dataset.loadcalc), calc = CALCS[cs.calc.id];
    Object.entries(cs.calc.values).forEach(([k, val]) => { const el = document.getElementById(`in-${calc.id}-${k}`); if (el) el.value = val; });
    compute(calc); go(calc.module);
    const card = document.getElementById('card-' + calc.id); card.scrollIntoView({ block: 'center' }); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    return;
  }
  const f = e.target.closest('figure[data-case]'); if (f) openLB(f.dataset.case, +f.dataset.n);
});
cv2.addEventListener('keydown', e => { const f = e.target.closest('figure[data-case]'); if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLB(f.dataset.case, +f.dataset.n); } });
let LB = null;
function openLB(cid, n) {
  const c = CASES.find(x => x.id === cid); if (!c) return;
  closeLB();
  LB = document.createElement('div'); LB.className = 'lightbox'; LB.setAttribute('role', 'dialog'); LB.setAttribute('aria-label', c.title);
  const show = () => { const im = c.images[n]; LB.innerHTML = `<img src="${esc(im.src)}" alt="${esc(im.caption)}"><p>${esc(c.title)} · ${esc(im.caption)} (${n + 1}/${c.images.length})</p><div class="row"><button class="btn" data-lb="prev" type="button">Previous</button><button class="btn" data-lb="close" type="button">Close</button><button class="btn" data-lb="next" type="button">Next</button></div>`; $('[data-lb="close"]', LB).focus(); };
  LB.addEventListener('click', e => { const a = e.target.closest('[data-lb]'); if (a) { if (a.dataset.lb === 'close') return closeLB(); n = (n + (a.dataset.lb === 'next' ? 1 : -1) + c.images.length) % c.images.length; show(); } else if (e.target === LB) closeLB(); });
  LB._key = e => { if (e.key === 'Escape') closeLB(); if (e.key === 'ArrowRight') { n = (n + 1) % c.images.length; show(); } if (e.key === 'ArrowLeft') { n = (n - 1 + c.images.length) % c.images.length; show(); } };
  document.addEventListener('keydown', LB._key);
  document.body.appendChild(LB); show();
}
function closeLB() { if (LB) { document.removeEventListener('keydown', LB._key); LB.remove(); LB = null; } }

/* ---------- references view ---------- */
const rv = document.createElement('section');
rv.className = 'view refs-list'; rv.dataset.view = 'refs'; rv.hidden = true;
const groups = [...MODULES.map(m => ({ title: m.title, keys: [...new Set(m.calculators.flatMap(c => [...c.refs, ...(c.flags || []).flatMap(f => f.refs || [])]))] })), ...(TOOLKIT_META.showCases ? [{ title: 'Interesting cases', keys: [...new Set(CASES.flatMap(c => c.refs))] }] : [])];
rv.innerHTML = `<div class="view-head"><h2>References</h2><p>Links open the article (DOI or PubMed Central) where known, otherwise a PubMed search for the title.</p></div>` +
  groups.map(g => `<h3>${esc(g.title)}</h3><ol>${g.keys.map(k => `<li><a href="${esc(refUrl(k))}" target="_blank" rel="noopener">${esc(refFull(k))}</a></li>`).join('')}</ol>`).join('') +
  `<p class="disclaimer">For research and education only. Not a medical device and not for clinical decision-making. Thresholds come from the cited literature, vary between populations, techniques and modalities, and should be interpreted with the full imaging and clinical picture. Toolkit v${esc(TOOLKIT_META.version)}, content reviewed ${esc(TOOLKIT_META.reviewed)}.</p>`;
main.appendChild(rv);

const foot = document.createElement('p'); foot.className = 'disclaimer';
foot.textContent = 'For research and education only. Not a medical device; not for clinical decision-making. Always interpret measurements with the full imaging and clinical picture.';
main.after(Object.assign(document.createElement('div'), { className: 'wrap' })); main.nextElementSibling.appendChild(foot);

go(location.hash.slice(1) || MODULES[0].id, { keepScroll: true });
})();
</script>
