cases:
  - id: sternal-foramen
    region: Chest
    title: Sternal fusion anomaly and the sternal foramen
    modality: CT, radiograph
    added: 2026-11
    images:
      - src: images/chest-sternum-coronal-mip.png
        caption: Coronal CT MIP
      - src: images/chest-sternum-sagittal-ct.png
        caption: Sagittal CT
      - src: images/chest-sternum-lateral-xr.png
        caption: Lateral chest radiograph
    findings: >-
      Coronal MIP and sagittal CT show a congenital fusion anomaly of the sternal body at a sternebral
      junction, also visible on the lateral radiograph. These anomalies occur where the sternal ossification
      centers fuse.
    teaching:
      - >-
        The sternal body forms from paired ossification centers (sternebrae) that fuse from caudal to cranial
        between puberty and about age 25. Incomplete fusion produces segmentation anomalies, clefts and
        foramina.
      - >-
        The most clinically relevant anomaly is the sternal foramen: a round or oval midline defect in the
        lower sternal body, found in about 4–7% of chest CTs (higher in some cadaver series). Reported widths
        range from under 1 mm to about 10 mm.
      - >-
        It is invisible on frontal radiographs and easy to miss on axial CT; coronal MIP or thick-slab and
        sagittal reformats show it best.
      - >-
        A needle placed through the foramen meets no bone. Cardiac tamponade and death have followed sternal
        acupuncture and sternal bone marrow aspiration. In one CT series, the pericardium or heart lay
        directly behind the foramen in 20% of patients, at a mean depth of about 5 cm from the skin.
      - >-
        Report a sternal foramen when present, especially in patients who may have sternal marrow sampling,
        acupuncture or other sternal procedures.
      - >-
        Fusion anomalies at sternebral junctions are developmental. Corticated margins and the absence of
        hematoma or soft-tissue swelling help separate them from fracture.
    refs:
      - yekeler2006
      - gossner2013
      - choi2017
      - sfmeta2023
      - restrepo2009
      - cooper1988
      - halvorsen1995
      - vanmarum2001
      - santavy2013
      - bardaa2020
      - babinski2012
  - id: sickle-h-vertebrae
    region: Lumbar spine
    also_in:
      - Hip
    title: 'Sickle cell disease: H-shaped vertebrae and femoral head AVN'
    modality: Radiograph, CT
    added: 2026-11
    images:
      - src: images/spine-sickle-lat-xr.png
        caption: Lateral lumbar radiograph
      - src: images/spine-sickle-ap-xr.png
        caption: AP lumbar radiograph
      - src: images/spine-sickle-sag-ct.png
        caption: Sagittal CT
      - src: images/spine-sickle-cor-ct.png
        caption: Coronal CT
    findings: >-
      Lumbar vertebral bodies show central, step-like endplate depressions with preserved peripheral
      endplates, giving an H shape, from endplate infarcts in a patient with sickle cell anemia. The patient
      also has bilateral avascular necrosis of the femoral heads; note the femoral head changes on the coronal
      CT and radiographs.
    teaching:
      - >-
        H-shaped ("Lincoln log") vertebrae result from infarction of the central endplate, which is supplied
        by long, thin nutrient end-arteries. The periphery has a separate apophyseal supply and keeps growing,
        leaving a square-edged central depression.
      - >-
        The sharp, step-like central depression differs from the smooth biconcave ("fish") vertebrae of
        osteoporosis or osteomalacia.
      - >-
        Differential for H-shaped vertebrae: sickle cell disease (most common), other hemoglobinopathies, and
        Gaucher disease. Compensatory overgrowth of adjacent vertebrae can give "tower vertebrae".
      - >-
        Femoral head avascular necrosis affects about 10% of patients with sickle cell disease, is often
        bilateral, and frequently progresses to collapse. Look for the contralateral hip and the humeral
        heads.
      - >-
        Stage femoral head AVN with ARCO criteria (subchondral fracture, crescent sign, collapse); MRI is most
        sensitive for early disease.
      - >-
        Other skeletal clues to sickle cell disease: marrow hyperplasia, medullary bone infarcts,
        bone-within-bone appearance, and osteomyelitis (Salmonella and Staphylococcus).
    refs:
      - ejindu2007
      - lonergan2001
      - marlow1998
      - schwartz1979
      - milner1991
      - hernigou2003
      - yoon2020
  - id: sclerotic-met
    region: Pelvis
    title: Sclerotic metastasis with rim enhancement and edema
    modality: CT, MRI
    added: 2026-11
    images:
      - src: images/pelvis-met-axial-ct.png
        caption: Axial CT
      - src: images/pelvis-met-axial-sub.png
        caption: Axial post-contrast subtraction MRI
      - src: images/pelvis-met-cor-t1.png
        caption: Coronal T1
      - src: images/pelvis-met-cor-stir.png
        caption: Coronal STIR
    findings: >-
      A sclerotic iliac lesion on CT is low signal on T1, has a peripheral rim of enhancement on subtraction
      imaging, and is surrounded by edema on STIR: a classic sclerotic metastasis.
    teaching:
      - >-
        A bone island (enostosis) is dark on all sequences, with no edema and no enhancement. Surrounding
        edema or a rim of enhancement around a sclerotic focus argues for metastasis.
      - >-
        The "halo sign", a rim of high T2 signal around a lesion, is strongly associated with metastasis. A
        central fat "bull's-eye" favors a benign focus.
      - >-
        On CT, untreated osteoblastic metastases have lower attenuation than bone islands: mean attenuation
        under 885 HU and maximum under 1060 HU favor metastasis.
      - >-
        Bone islands have brush-like spiculated margins that blend with adjacent trabeculae. Size growth alone
        does not prove malignancy.
      - >-
        Common sources of sclerotic metastases: prostate and breast; also carcinoid, bladder, lung and
        medulloblastoma.
      - >-
        A replaced-marrow lesion shows little signal drop on opposed-phase imaging (see the Chemical shift
        calculator).
    refs:
      - schweitzer1993
      - ulano2016
      - greenspan1995
      - zajick2005
  - id: synovial-sarcoma-met
    region: Thigh
    title: Slow-growing intramuscular metastasis from synovial sarcoma
    modality: PET/CT, MRI
    added: 2026-11
    images:
      - src: images/thigh-ssmet-petct-initial.png
        caption: FDG PET/CT, initial study
      - src: images/thigh-ssmet-petct-followup.png
        caption: FDG PET/CT, about 9 months later
      - src: images/thigh-ssmet-t2fs.png
        caption: Axial fluid-sensitive fat-suppressed MRI
      - src: images/thigh-ssmet-t1.png
        caption: Axial T1
    findings: >-
      In a patient with synovial sarcoma, a small FDG-avid focus in the posterior thigh musculature on the
      initial PET/CT was detected again about 9 months later, larger and more avid. MRI shows a
      well-circumscribed intramuscular mass that is T2 hyperintense, isointense to muscle on T1, and avidly
      enhancing: a slow-growing metastasis.
    teaching:
      - >-
        Synovial sarcoma often looks deceptively benign: small, well-defined and slow-growing, sometimes with
        a long history. Slow growth does not exclude malignancy.
      - >-
        Lung is the most common metastatic site, but soft-tissue and intramuscular metastases occur. In a
        sarcoma patient, a new enhancing intramuscular nodule is a metastasis until proven otherwise.
      - >-
        Synovial sarcoma metastasizes late; many metastases appear more than 5 years after diagnosis, so long
        surveillance matters.
      - >-
        An isointense T1 lesion can be nearly invisible on T1 alone. Fluid-sensitive and post-contrast
        fat-suppressed images find small intramuscular deposits.
      - >-
        Classic primary tumor features: heterogeneous T2 "triple signal", fluid levels, calcification in about
        a third on radiographs, and a juxta-articular location.
    refs:
      - murphey2006
      - jones1993
      - krieg2011
  - id: psma-red-marrow
    region: Femur
    also_in:
      - Hip
    title: 'PSMA-avid femoral lesion: focal red marrow, not metastasis'
    modality: PSMA PET/CT, MRI
    added: 2026-11
    images:
      - src: images/femur-psma-petct.png
        caption: 'PSMA PET/CT: uptake in the right proximal femur'
      - src: images/femur-psma-cor-fluid.png
        caption: Coronal fluid-sensitive MRI
      - src: images/femur-psma-ax-fluid.png
        caption: Axial fluid-sensitive MRI
      - src: images/femur-psma-cor-t1.png
        caption: Coronal T1
      - src: images/femur-psma-ax-t1.png
        caption: Axial T1
      - src: images/femur-psma-op-roi.png
        caption: Opposed-phase with ROI (mean 26.56)
      - src: images/femur-psma-ip-roi.png
        caption: In-phase with ROI (mean 259.05)
    findings: >-
      A PSMA-avid focus in the right proximal femur was suspected to be a metastasis. MRI showed a focal
      marrow lesion with marked signal loss on opposed-phase imaging (ROI mean 259.05 in-phase vs 26.56
      opposed-phase, about a 90% drop), most consistent with a focal island of red marrow.
    teaching:
      - >-
        PSMA is not prostate-specific. Benign bone uptake is common: fractures, fibrous dysplasia, Paget
        disease, hemangiomas, degenerative change, and focal or hyperplastic red marrow. Isolated mild rib
        uptake is a frequent pitfall, especially with 18F-PSMA-1007.
      - >-
        Structured systems (PSMA-RADS, E-PSMA) grade a solitary indeterminate bone focus as equivocal and
        recommend correlation rather than calling it metastatic.
      - >-
        Chemical shift MRI resolves many of these: red marrow keeps fat between its cells and drops signal on
        opposed-phase. A drop of 20% or more (OP/IP ratio 0.80 or less) favors a non-neoplastic process; here
        the drop is about 90%.
      - >-
        The T1 rule helps too: marrow brighter than skeletal muscle (or disc) on T1 is almost always
        hematopoietic marrow; lesions darker than muscle are suspicious.
      - >-
        Use an ROI matched in size and position on both echoes and avoid cortex. Very small ROIs are sensitive
        to partial volume, so check that the result fits the morphology.
    refs:
      - rowe2018
      - ceci2021
      - rauscher2020
      - zajick2005
      - disler1997
      - carroll1997
