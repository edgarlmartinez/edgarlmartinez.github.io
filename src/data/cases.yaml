      href: toolkit/#cs
      label: Try the % signal drop calculator in the MSK toolkit
  - id: ewing-scapula
    region: Shoulder
    title: 'Ewing sarcoma of the scapula: easy to miss on radiographs'
    modality: Radiograph, MRI
    added: 2026-11
    images:
      - src: images/shoulder-ewing-xr.png
        caption: AP shoulder radiograph
      - src: images/shoulder-ewing-mri-fs.png
        caption: Fat-suppressed MRI
    findings: >-
      Ewing sarcoma of the scapula. The radiographic findings are subtle and easily overlooked unless the
      scapula is specifically reviewed; fat-suppressed MRI shows the marrow lesion and its soft-tissue
      component.
    teaching:
      - >-
        Flat bones (pelvis, scapula, ribs) are common Ewing sites, more so with increasing age. The
        soft-tissue mass is often large compared with the subtle bone change.
      - >-
        On the AP shoulder, the scapular body overlaps the ribs and is easily skipped. Make the scapula part
        of the search pattern: trace the axillary and medial borders, the glenoid neck, the spine and the
        coracoid, and compare cortical outlines and trabecular density.
      - >-
        Look for permeative or moth-eaten destruction, faint sclerosis, periosteal reaction along the borders,
        and displaced fat planes from a soft-tissue mass. Add a scapular Y view, and use CT or MRI for
        persistent or night pain.
      - >-
        Delay is common: early symptoms are often blamed on sports injury, and the first radiograph is
        frequently read as normal.
      - >-
        MRI defines marrow extent, the soft-tissue mass and skip lesions; staging needs chest CT and
        whole-body imaging.
    refs:
      - murphey2013
      - widhe2000
  - id: posterior-talar-process
    region: Ankle
    also_in:
      - Foot
    title: Posterior talar process fracture
    modality: Radiograph
    added: 2026-11
    images:
      - src: images/ankle-posterior-talar-process-fx.png
        caption: Lateral ankle radiograph
    findings: >-
      Lateral radiograph shows a fracture of the posterior process of the talus, a rare and frequently missed
      injury.
    teaching:
      - >-
        The posterior process has a lateral and a medial tubercle, with the flexor hallucis longus tendon
        running in the groove between them.
      - >-
        Shepherd fracture: lateral tubercle, from forced plantar flexion (impaction against the posterior
        tibia) or avulsion by the posterior talofibular ligament.
      - >-
        Cedell fracture: medial tubercle, from dorsiflexion and pronation with avulsion by the posterior
        tibiotalar ligament. It is hard to see on the lateral view.
      - >-
        Os trigonum (unfused lateral tubercle, present in roughly 7–14% of people) is the main differential.
        It has smooth, fully corticated, rounded margins and is often bilateral. A fracture has irregular,
        non-corticated edges, local swelling and acute pain.
      - >-
        CT confirms the fracture and shows its size and subtalar joint involvement. Missed fractures can lead
        to nonunion, posterior impingement and FHL tenosynovitis.
    refs:
      - melenevsky2015
      - shepherd1882
      - cedell1974
      - nyska1998
      - karasick1996
