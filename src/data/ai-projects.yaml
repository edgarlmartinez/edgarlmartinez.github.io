# Public AI model builds (public datasets only).
# Never list or link models fine-tuned on BIDMC data, and never commit
# patient data or keys.

projects:
  - title: MSK measurement toolkit (v1.0)
    demo: ai/msk-toolkit/
    repo: https://github.com/edgarlmartinez/edgarlmartinez.github.io/tree/main/public/ai/msk-toolkit
    model: Literature-based calculators, no trained model
    status: >-
      Interactive offline reference for 27 musculoskeletal measurements, from
      Cobb angle and craniocervical intervals to chemical shift signal drop,
      acromiohumeral interval, hip coverage, distal radius and hallux valgus.
      Each gives normal ranges, grading and the cited source, with a how-to
      diagram and a tool to measure angles and lengths on your own images.
    year: 2026
    tags: [Measurements, Radiographs, MRI, Education]
  - title: Vertebral morphometry on lateral spine radiographs (v0.1)
    demo: ai/vertebral-morphometry/
    repo: https://github.com/edgarlmartinez/edgarlmartinez.github.io/tree/main/public/ai/vertebral-morphometry
    dataset: VerSe 2019 spine CT (simulated lateral radiographs)
    dataset_url: https://github.com/anjany/verse
    license: CC BY-SA 4.0
    model: Landmark heatmap network, 0.5M parameters
    status: >-
      Early research baseline. Measures vertebral body height loss against
      the expected normal height from adjacent levels (Genant grade), and
      estimates retropulsion as posterior wall displacement and sagittal canal
      compromise. On 8 held-out simulated cases it agreed on 59 of 61 normal
      levels but detected only 6 of 14 fractures. Not yet tested on real
      radiographs.
    year: 2026
    tags: [Spine, Radiographs, Fractures, Morphometry]
  - title: MSK tumor segmentation and radiomics on CT and MRI (v0.1)
    demo: ai/msk-tumor-radiomics/
    repo: https://github.com/edgarlmartinez/edgarlmartinez.github.io/tree/main/public/ai/msk-tumor-radiomics
    dataset: TCIA Soft-tissue-Sarcoma (51 patients, T1, T2FS/STIR, CT)
    dataset_url: https://www.cancerimagingarchive.net/collection/soft-tissue-sarcoma/
    license: CC BY 3.0
    model: nnU-Net v2 3D (MRI and CT models), PyRadiomics with IBSI settings
    status: >-
      Early research baseline. Automatically segments extremity soft-tissue
      sarcomas and reports volume, diameters and texture features, flagging
      features that stay stable when the contour changes. On 11 held-out
      patients the median Dice was 0.74 on T1 and 0.75 on T2FS/STIR, and 0.48
      on the CT of PET/CT. Trained on CPU with a shortened schedule; CT is not
      yet usable.
    year: 2026
    tags: [MSK, Oncology, MRI, CT, Radiomics, Segmentation]
