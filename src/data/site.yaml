display_name: Edgar L. Martinez Salazar, MD
short_name: Leo Martinez, MD
headline: Musculoskeletal Radiologist
affiliation: Beth Israel Deaconess Medical Center · Harvard Medical School

bio: >-
  I am a musculoskeletal radiologist at Beth Israel Deaconess Medical Center
  and Instructor of Radiology at Harvard Medical School, where I serve as
  Interim Section Chief of Musculoskeletal Radiology and as the section's
  Quality Assurance and Education Officer. I trained in medicine at the
  Universidad de Antioquia in Colombia, completed a postdoctoral research
  fellowship in musculoskeletal radiology at Massachusetts General Hospital,
  diagnostic radiology residency at UMass Chan Medical School-Baystate
  Medical Center, and a musculoskeletal radiology fellowship at BIDMC.

# Short topics shown as tags on the home page.
interests:
  - Musculoskeletal MRI
  - Sports and joint injuries
  - Hip preservation imaging
  - Musculoskeletal ultrasound and US-guided interventions
  - Bone and soft tissue tumors
  - Body composition and metabolic imaging
  - AI in musculoskeletal imaging
  - Radiology education and mentorship

