# Lecture library for residents and fellows.
#
# The slides themselves are NOT stored in this public repository. They stay
# in Google Slides. For each lecture: open it in Google Slides > Share >
# under "General access" choose "Restricted" > add the residents/fellows
# (or a Google Group) as Viewers > Copy link, and paste the link below.
# Only invited people can open it, even though this list is public.
#
# Tip: put all lectures in one Google Drive folder shared with your trainees.
# Anything you add to that folder is shared automatically; paste its link in
# `folder_link` and the page shows an "Open the full library" button.
#
# Leave `link` empty to show the lecture as "coming soon".

folder_link: ""

note: >-
  Slides open in Google Slides and are shared only with invited residents and
  fellows. If you need access, email Dr. Martinez Salazar. Please do not
  redistribute.

